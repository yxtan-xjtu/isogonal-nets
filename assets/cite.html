<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX references — Quad-mesh Based Isogonal Nets and Computational Design</title>
  <style>
    :root {
      --teal: #28a9b4;
      --teal-dark: #176b7b;
      --teal-deep: #0d4351;
      --text: #34464d;
      --muted: #718188;
      --line: #cfe2e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 26px 28px 30px;
      color: var(--text);
      background: linear-gradient(180deg, #eef8f9 0, #f8fbfb 240px, #f5f9fa 100%);
      font-family: Inter, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .accent {
      position: fixed;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--teal-deep), var(--teal), #59d6dc, #287aa3);
    }
    h1 {
      margin: 0;
      color: var(--teal-deep);
      font-size: 19px;
      font-weight: 720;
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 6px 0 16px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }
    pre {
      margin: 0;
      padding: 16px 18px;
      border: 1px solid rgba(40, 169, 180, 0.28);
      border-radius: 12px;
      background: #fff;
      color: #1b3a42;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      padding: 8px 16px;
      border: 1px solid rgba(23, 107, 123, 0.35);
      border-radius: 10px;
      background: #fff;
      color: var(--teal-dark);
      font: inherit;
      font-size: 13px;
      font-weight: 620;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    button:hover {
      border-color: var(--teal);
      background: rgba(40, 169, 180, 0.10);
      color: var(--teal-deep);
    }
    .status {
      color: var(--teal-dark);
      font-size: 12.5px;
      font-weight: 600;
    }
    footer {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    footer a {
      color: var(--teal-dark);
      text-decoration: none;
      border-bottom: 1px solid rgba(40, 169, 180, 0.38);
    }
    footer a:hover { color: var(--teal-deep); }
  </style>
</head>
<body>
  <div class="accent"></div>

  <h1>BibTeX</h1>
  <p class="subtitle">
    Bibliography cited in <em>Quad-mesh Based Isogonal Nets and Computational Design</em>
    — loaded directly from <code>reference.bib</code>.
  </p>

  <pre id="bibtex" aria-live="polite">Loading reference.bib …</pre>

  <div class="row">
    <button id="copy" type="button" disabled>Copy to clipboard</button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>

  <footer>
    Download the file: <a href="reference.bib">reference.bib</a>
  </footer>

  <script>
    (function () {
      var pre = document.getElementById('bibtex');
      var button = document.getElementById('copy');
      var status = document.getElementById('status');
      var text = '';

      function flash(message) {
        status.textContent = message;
        window.setTimeout(function () { status.textContent = ''; }, 2000);
      }

      function entryCount(source) {
        var matches = source.match(/@(?!string|preamble|comment)[a-zA-Z]+\s*\{/gi);
        return matches ? matches.length : 0;
      }

      // The reference list lives in reference.bib, so the popup always shows the
      // current file instead of a duplicated copy inside this page.
      if (window.fetch) {
        fetch('reference.bib')
          .then(function (response) {
            if (!response.ok) { throw new Error(response.status); }
            return response.text();
          })
          .then(function (source) {
            text = source;
            pre.textContent = source;
            button.disabled = false;
            var n = entryCount(source);
            status.textContent = n + ' entries';
            window.setTimeout(function () { status.textContent = ''; }, 4000);
          })
          .catch(function () {
            pre.textContent =
              'Could not load reference.bib automatically.\n' +
              'Open ' + new URL('reference.bib', document.baseURI).href + ' instead.';
          });
      } else {
        pre.textContent = 'Open reference.bib to view the bibliography.';
      }

      button.addEventListener('click', function () {
        if (!text) { return; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { flash('Copied.'); },
            function () { flash('Press Ctrl+C to copy.'); }
          );
          return;
        }
        var range = document.createRange();
        range.selectNodeContents(pre);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        flash('Press Ctrl+C to copy.');
      });
    }());
  </script>
</body>
</html>
